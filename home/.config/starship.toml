# ==========================================================
# Starship Configuration
# Minimal • Fast • Developer
# ==========================================================

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$docker_context\
$hostname\
$fill\
$cmd_duration\
$line_break\
$status\
$character
"""

# ----------------------------------------------------------
# Prompt
# ----------------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ----------------------------------------------------------
# Directory
# ----------------------------------------------------------

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
read_only = " "

# ----------------------------------------------------------
# Git
# ----------------------------------------------------------

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
style = "bold red"

conflicted = "~"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

format = " [$all_status$ahead_behind]($style)"

# ----------------------------------------------------------
# Docker
# ----------------------------------------------------------

[docker_context]
symbol = " "
style = "bold blue"

# ----------------------------------------------------------
# SSH Host
# ----------------------------------------------------------

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

# ----------------------------------------------------------
# Username
# ----------------------------------------------------------

[username]
show_always = false
style_root = "bold red"
format = "[$user]($style) "

# ----------------------------------------------------------
# Command Duration
# ----------------------------------------------------------

[cmd_duration]
min_time = 1500
format = "[󰔛 $duration](yellow)"

# ----------------------------------------------------------
# Exit Status
# ----------------------------------------------------------

[status]
disabled = false
symbol = "✘ "
format = "[$symbol$status]($style)"
style = "bold red"

# ----------------------------------------------------------
# Background Jobs
# ----------------------------------------------------------

[jobs]
symbol = "⚙ "
style = "yellow"

# ----------------------------------------------------------
# Fill
# ----------------------------------------------------------

[fill]
symbol = " "

# ----------------------------------------------------------
# Disabled Modules
# ----------------------------------------------------------

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[package]
disabled = true

[memory_usage]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[php]
disabled = true

[time]
disabled = true
